<aside class="col-lg-3">
  <div class="card shadow-sm border-0 rounded-4 p-3 bg-light">
    <h5 class="mb-3 fw-bold text-center">فلترة المنتجات</h5>

    <div class="accordion" id="filterAccordion">

      <!-- الفئة -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingCategory">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseCategory" aria-expanded="false" aria-controls="collapseCategory">
            الفئة
          </button>
        </h2>
        <div id="collapseCategory" class="accordion-collapse collapse" aria-labelledby="headingCategory"
          data-bs-parent="#filterAccordion">
          <div class="accordion-body">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="catPhone">
              <label class="form-check-label" for="catPhone">هواتف ذكية</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="catLaptop">
              <label class="form-check-label" for="catLaptop">لابتوبات</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="catHeadphones">
              <label class="form-check-label" for="catHeadphones">سماعات</label>
            </div>
          </div>
        </div>
      </div>

      <!-- السعر -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingPrice">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapsePrice" aria-expanded="false" aria-controls="collapsePrice">
            السعر
          </button>
        </h2>
        <div id="collapsePrice" class="accordion-collapse collapse" aria-labelledby="headingPrice"
          data-bs-parent="#filterAccordion">
          <div class="accordion-body">
            <label for="priceRange" class="form-label d-flex justify-content-between">
              <span>حتى:</span> <span id="priceValue">2500</span> ريال
            </label>
            <input type="range" class="form-range" min="0" max="5000" step="100" id="priceRange" value="2500"
              oninput="document.getElementById('priceValue').textContent = this.value;">
          </div>
        </div>
      </div>

      <!-- العلامة التجارية -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingBrand">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseBrand" aria-expanded="false" aria-controls="collapseBrand">
            العلامة التجارية
          </button>
        </h2>
        <div id="collapseBrand" class="accordion-collapse collapse" aria-labelledby="headingBrand"
          data-bs-parent="#filterAccordion">
          <div class="accordion-body">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="brandApple">
              <label class="form-check-label" for="brandApple">Apple</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="brandSamsung">
              <label class="form-check-label" for="brandSamsung">Samsung</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="brandXiaomi">
              <label class="form-check-label" for="brandXiaomi">Xiaomi</label>
            </div>
          </div>
        </div>
      </div>

      <!-- التقييم -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingRating">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapseRating" aria-expanded="false" aria-controls="collapseRating">
            التقييم
          </button>
        </h2>
        <div id="collapseRating" class="accordion-collapse collapse" aria-labelledby="headingRating"
          data-bs-parent="#filterAccordion">
          <div class="accordion-body">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rating5">
              <label class="form-check-label" for="rating5">⭐⭐⭐⭐⭐</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rating4">
              <label class="form-check-label" for="rating4">⭐⭐⭐⭐</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rating3">
              <label class="form-check-label" for="rating3">⭐⭐⭐</label>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- زر تطبيق -->
    <div class="d-grid mt-4">
      <button class="btn btn-primary rounded-pill">تطبيق الفلاتر</button>
    </div>
